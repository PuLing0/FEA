[project]
name = "fig-edit-agent"
version = "0.1.0"
description = "Minimal runtime schemas for the fig edit agent."
requires-python = ">=3.11"
dependencies = [
    "langchain-openai>=1.0,<2.0",
    "langgraph>=1.1.8,<2.0",
    "langgraph-cli[inmem]>=0.4.7,<0.5.0",
    "huggingface_hub>=0.24,<1.0",
    "numpy>=1.26,<3.0",
    "opencv-python-headless>=4.8,<5.0",
    "pydantic>=2.7,<3.0",
    "pydantic-ai>=1.84.1,<2.0",
    "pillow>=10.0,<12.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-mock>=3.14,<4.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["agents", "llm", "runtime", "schema", "tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
